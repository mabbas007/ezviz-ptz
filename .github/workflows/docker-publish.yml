name: Build and publish image

# Builds the linux/amd64 bridge image and pushes it to GitHub Container
# Registry (ghcr.io). Triggers:
#   - pull request: run the Go unit tests and integration test, never publish
#   - push to main: publish <MAJOR>.<MINOR>, :<MAJOR>, :latest, :main and :sha-...
#   - manual run from main: same as a push
#
# <MAJOR> is the number in the VERSION file (edit it to bump the major).
# <MINOR> is the number of first-parent commits since VERSION last changed, so
# the first build after a major bump is X.0 and each subsequent commit bumps it.
#
# Nothing needs to be configured in the repository: GITHUB_TOKEN is enough.
# The first run creates the package; see the README for visibility/auth.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Check formatting
        working-directory: frigate-onvif-go
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: frigate-onvif-go
        run: go vet ./...
      - name: Test
        working-directory: frigate-onvif-go
        run: go test -race ./...

  test:
    name: Integration test (fake SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run the ONVIF end-to-end test
        run: ./frigate-onvif/tests/run.sh

  publish:
    name: Publish to GHCR
    needs: [go, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # VERSION's history is needed to derive the minor version.
          fetch-depth: 0

      - name: Compute release version
        id: release
        run: |
          set -euo pipefail
          major="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$major" =~ ^[0-9]+$ ]]; then
            echo "VERSION must contain a single integer major version (e.g. 1)" >&2
            exit 1
          fi
          base="$(git log -1 --format=%H -- VERSION)"
          if [ -z "$base" ]; then
            echo "VERSION is not tracked in git history" >&2
            exit 1
          fi
          minor="$(git rev-list --count --first-parent "$base..HEAD")"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "Publishing $major.$minor"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # The repository owner; GITHUB_TOKEN is scoped to this repository.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.major }}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=EZVIZ/Hikvision ONVIF PTZ bridge
            org.opencontainers.image.description=ONVIF PTZ server that drives EZVIZ/Hikvision cameras through the Hikvision SDK
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frigate-onvif/Dockerfile
          # The Hikvision SDK ships x86-64 Linux libraries only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
